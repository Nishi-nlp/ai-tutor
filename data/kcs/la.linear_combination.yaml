id: la.linear_combination
name: 線形結合
description: 複数のベクトルをスカラー倍して加えたもの

prerequisites: []

learning_objectives:
  - 線形結合を「複数のベクトルをスカラー倍して加えたもの」と説明できる
  - 与えられたベクトルと係数から線形結合を計算できる
  - 行列ベクトル積を行列の列ベクトルの線形結合として読み替えられる

source_refs:
  - document: strang
    pages: [12, 13]
    relation: explanation
  - document: goodfellow
    pages: [37, 38]
    relation: application

mastery:
  threshold: 0.85
  required_evidence:
    - no_hint_full_correct
