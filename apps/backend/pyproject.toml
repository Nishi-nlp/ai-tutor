[project]
name = "ai-tutor-backend"
version = "0.1.0"
description = "FastAPI backend for AI Tutor"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
